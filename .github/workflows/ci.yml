name: CI

on:
  # Branch pushes are covered by their pull request; one runner serves every repo.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IROH_RELAY_VERSION: "1.2.0"

jobs:
  build:
    name: Build and unit checks
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The monorepo is private. The org's GitHub App mints a token, valid for an hour, that can
      # only read tidefell/tidefell; it downloads the pinned release's AAR.
      - name: Token for the monorepo
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.CROSS_REPO_CI_APP }}
          private-key: ${{ secrets.CROSS_REPO_CI_KEY }}
          owner: Tidefell
          repositories: tidefell
          permission-contents: read
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # The self-hosted runner may not carry an Android SDK the way GitHub's images do.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default also asks for `tools`, which the SDK repository no longer carries.
          packages: platform-tools
      - name: Fetch the pinned tidefell-ffi AAR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: scripts/fetch-ffi.sh
      - name: Build
        # Android Lint fails on any finding not in app/lint-baseline.xml (ADR 0031).
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: detekt
        # With its formatting rules; existing findings are in detekt-baseline.xml.
        run: scripts/detekt.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 7
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  exit-criterion:
    name: Exit criterion on an emulator
    runs-on: self-hosted
    timeout-minutes: 45
    # The emulator (5554) and the test relay (3340) use fixed ports, so with several runners on
    # one host only one of these jobs may run at a time. Other jobs still run in parallel.
    concurrency:
      group: android-emulator
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Token for the monorepo
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.CROSS_REPO_CI_APP }}
          private-key: ${{ secrets.CROSS_REPO_CI_KEY }}
          owner: Tidefell
          repositories: tidefell
          permission-contents: read
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # The self-hosted runner may not carry an Android SDK the way GitHub's images do.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default also asks for `tools`, which the SDK repository no longer carries.
          packages: platform-tools
      - name: Fetch the pinned AAR and tidefelld
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          scripts/fetch-ffi.sh
          version=$(sed -n 's/^tidefell = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          name="tidefell-$version-x86_64-unknown-linux-gnu"
          gh release download "v$version" --repo tidefell/tidefell --pattern "$name.tar.gz" --pattern "$name.tar.gz.sha256"
          sha256sum --check "$name.tar.gz.sha256"
          tar -xzf "$name.tar.gz"
          echo "$PWD/$name" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      # Keyed by runner type: the cache stores paths relative to the workspace, which sits at a
      # different depth on GitHub's images and on the self-hosted runner.
      - name: Cache iroh-relay
        id: relay
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/iroh-relay
          key: iroh-relay-${{ runner.environment }}-${{ env.IROH_RELAY_VERSION }}
      - name: Build iroh-relay
        if: steps.relay.outputs.cache-hit != 'true'
        run: >
          cargo install iroh-relay --version "$IROH_RELAY_VERSION" --locked --features server
          --root "$HOME/.local/iroh-relay"
      - name: Put iroh-relay on PATH
        run: |
          echo "$HOME/.local/iroh-relay/bin" >> "$GITHUB_PATH"
          "$HOME/.local/iroh-relay/bin/iroh-relay" --version
      - name: Enable KVM
        # GitHub's images need a udev rule to open /dev/kvm; the self-hosted runner's user is
        # already in the kvm group.
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is usable"
            exit 0
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Each line runs in turn; ADR 0033's file names need a virtual FAT card (adb root).
          script: |
            scripts/ci-exit-criterion.sh
            scripts/file-names.sh

  # Shell scripts and spelling (ADR 0031). The repository has no Nix files.
  shell-and-spelling:
    name: Shell and spelling
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: shellcheck@0.11.0,typos@1.50.2
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: typos
        run: typos

  # The workflows themselves (ADR 0031): actionlint, and zizmor, whose findings of medium
  # severity or higher fail, so actions stay pinned by commit.
  workflows:
    name: Workflows
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: zizmor@1.30.1
      - name: actionlint
        # install-action does not carry it: the release binary, checked against its checksum.
        run: |
          version=1.7.12
          name="actionlint_${version}_linux_amd64.tar.gz"
          curl -sfL -o "$RUNNER_TEMP/$name" "https://github.com/rhysd/actionlint/releases/download/v$version/$name"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$name" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: zizmor
        run: zizmor --offline --min-severity medium .
