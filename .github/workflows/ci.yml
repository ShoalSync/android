name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  IROH_RELAY_VERSION: "1.2.0"

jobs:
  build:
    name: Build and unit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The monorepo is private. The org's GitHub App mints a token, valid for an hour, that can
      # only read tidefell/tidefell; it downloads the pinned release's AAR.
      - name: Token for the monorepo
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CROSS_REPO_CI_APP }}
          private-key: ${{ secrets.CROSS_REPO_CI_KEY }}
          owner: Tidefell
          repositories: tidefell
          permission-contents: read
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the pinned tidefell-ffi AAR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: scripts/fetch-ffi.sh
      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  exit-criterion:
    name: Exit criterion on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Token for the monorepo
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CROSS_REPO_CI_APP }}
          private-key: ${{ secrets.CROSS_REPO_CI_KEY }}
          owner: Tidefell
          repositories: tidefell
          permission-contents: read
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the pinned AAR and tidefelld
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          scripts/fetch-ffi.sh
          version=$(sed -n 's/^tidefell = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          name="tidefell-$version-x86_64-unknown-linux-gnu"
          gh release download "v$version" --repo tidefell/tidefell --pattern "$name.tar.gz" --pattern "$name.tar.gz.sha256"
          sha256sum --check "$name.tar.gz.sha256"
          tar -xzf "$name.tar.gz"
          echo "$PWD/$name" >> "$GITHUB_PATH"
      - name: Cache iroh-relay
        id: relay
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/iroh-relay
          key: iroh-relay-${{ env.IROH_RELAY_VERSION }}
      - name: Build iroh-relay
        if: steps.relay.outputs.cache-hit != 'true'
        run: cargo install iroh-relay --version "$IROH_RELAY_VERSION" --locked --features server
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: scripts/ci-exit-criterion.sh
