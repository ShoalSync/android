name: CI

# On GitHub's hosted runners (ADR 0045 in the monorepo). shoal-ffi is built from the pinned
# monorepo release's source, fetched from the public repository.
on:
  # Branch pushes are covered by their pull request.
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older runs. Each push to main runs in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IROH_RELAY_VERSION: "1.2.0"
  # The same NDK and cargo-ndk as the monorepo's own Android library job.
  NDK_VERSION: "30.0.16248370"
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  build:
    name: Build and unit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default also asks for `tools`, which the SDK repository no longer carries.
          packages: platform-tools
      # In build/shoal, where the cache below keeps its target directory.
      - name: The pinned monorepo release
        run: scripts/monorepo.sh
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: x86_64-linux-android
      # shoal-ffi's compiled dependencies and cargo-ndk, saved from main only.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: build/shoal -> target
          shared-key: android
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # CI builds the emulator's ABI only.
      - name: cargo-ndk and the NDK
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -q " $CARGO_NDK_VERSION"; then
            cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION" --force
          fi
          # Steps run with pipefail, and yes ends on SIGPIPE once sdkmanager stops reading.
          (yes || true) | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;$NDK_VERSION" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "GRADLE_FFI=-PshoalFfiLocalPath=$PWD/build/shoal -Pshoal.abis=x86_64" >> "$GITHUB_ENV"
      - name: Build
        # Unit tests, with every screen compared with its screenshot in app/src/test/screenshots.
        # Android Lint fails on any finding not in app/lint-baseline.xml (ADR 0031).
        run: |
          # GRADLE_FFI is several arguments, so it is split on purpose.
          # shellcheck disable=SC2086
          ./gradlew --no-daemon --stacktrace $GRADLE_FFI :app:verifyRoborazziDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Screenshot differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          name: screenshot-differences
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
      - name: detekt
        # With its formatting rules; existing findings are in detekt-baseline.xml.
        run: scripts/detekt.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  exit-criterion:
    name: Exit criterion on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The emulator needs /dev/kvm, which the runner's user may not open until this rule.
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      # The image's preinstalled toolchains that no step here uses, for the Nix store.
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default also asks for `tools`, which the SDK repository no longer carries.
          packages: platform-tools
      - name: The pinned monorepo release
        id: monorepo
        run: |
          scripts/monorepo.sh
          echo "version=$(sed -n 's/^shoal = "\(.*\)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: x86_64-linux-android
      # The same cache as the build job's; iroh-relay too, which is installed into ~/.cargo.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: build/shoal -> target
          shared-key: android-exit-criterion
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: cargo-ndk and the NDK
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -q " $CARGO_NDK_VERSION"; then
            cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION" --force
          fi
          # Steps run with pipefail, and yes ends on SIGPIPE once sdkmanager stops reading.
          (yes || true) | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;$NDK_VERSION" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "GRADLE_FFI=-PshoalFfiLocalPath=$PWD/build/shoal -Pshoal.abis=x86_64" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # The Nix store that builds the pinned release's shoald, kept per release, saved from main.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-shoald-${{ steps.monorepo.outputs.version }}
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 6G
      # The same release's shoald and shoal, built by Nix from its source.
      - name: The pinned release's shoald
        env:
          VERSION: ${{ steps.monorepo.outputs.version }}
        run: |
          out=$(nix build --no-link --print-out-paths --print-build-logs \
            "github:ShoalSync/shoal/v$VERSION#shoal")
          echo "$out/bin" >> "$GITHUB_PATH"
          "$out/bin/shoald" --version
      - name: iroh-relay
        run: |
          if ! iroh-relay --version 2>/dev/null | grep -q " $IROH_RELAY_VERSION"; then
            cargo install iroh-relay --version "$IROH_RELAY_VERSION" --locked --features server --force
          fi
          iroh-relay --version
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Each line runs in turn; ADR 0033's file names need a virtual FAT card (adb root).
          # The scripts add 10.0.2.2, the address the emulator reaches the host at, to the
          # loopback with sudo.
          script: |
            scripts/ci-exit-criterion.sh $GRADLE_FFI
            scripts/file-names.sh $GRADLE_FFI

  # The design tokens (design/README.md): the committed dist/ must be what the tokens build.
  design:
    name: Design tokens
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: design/.node-version
      - name: Build
        working-directory: design
        run: |
          npm ci
          npm run build
      - name: dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain -- design/dist)" ]; then
            git status --short -- design/dist
            git diff -- design/dist
            echo "design/dist differs from what the tokens build: run npm run build in design/ and commit it."
            exit 1
          fi

  # Shell scripts and spelling (ADR 0031). The repository has no Nix files.
  shell-and-spelling:
    name: Shell and spelling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: shellcheck@0.11.0,typos@1.50.2
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: typos
        run: typos
      # The old name stays out of the tree (ADR 0043 in the monorepo).
      - name: The old name stays out
        run: scripts/check-old-name.sh

  # The workflows themselves (ADR 0031): actionlint, and zizmor, whose findings of medium
  # severity or higher fail, so actions stay pinned by commit.
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: zizmor@1.30.1
      - name: actionlint
        # install-action does not carry it: the release binary, checked against its checksum.
        run: |
          version=1.7.12
          name="actionlint_${version}_linux_amd64.tar.gz"
          curl -sfL -o "$RUNNER_TEMP/$name" "https://github.com/rhysd/actionlint/releases/download/v$version/$name"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$name" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: zizmor
        run: zizmor --offline --min-severity medium .github
