name: CI

on:
  # Branch pushes are covered by their pull request; one runner serves every repo.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IROH_RELAY_VERSION: "1.2.0"

jobs:
  build:
    name: Build and unit checks
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # The monorepo is private. The org's GitHub App mints a token, valid for an hour, that can
      # only read tidefell/tidefell; it downloads the pinned release's AAR.
      - name: Token for the monorepo
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CROSS_REPO_CI_APP }}
          private-key: ${{ secrets.CROSS_REPO_CI_KEY }}
          owner: Tidefell
          repositories: tidefell
          permission-contents: read
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The self-hosted runner may not carry an Android SDK the way GitHub's images do.
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for `tools`, which the SDK repository no longer carries.
          packages: platform-tools
      - name: Fetch the pinned tidefell-ffi AAR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: scripts/fetch-ffi.sh
      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  exit-criterion:
    name: Exit criterion on an emulator
    runs-on: self-hosted
    timeout-minutes: 45
    # The emulator (5554) and the test relay (3340) use fixed ports, so with several runners on
    # one host only one of these jobs may run at a time. Other jobs still run in parallel.
    concurrency:
      group: android-emulator
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Token for the monorepo
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CROSS_REPO_CI_APP }}
          private-key: ${{ secrets.CROSS_REPO_CI_KEY }}
          owner: Tidefell
          repositories: tidefell
          permission-contents: read
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The self-hosted runner may not carry an Android SDK the way GitHub's images do.
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for `tools`, which the SDK repository no longer carries.
          packages: platform-tools
      - name: Fetch the pinned AAR and tidefelld
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          scripts/fetch-ffi.sh
          version=$(sed -n 's/^tidefell = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          name="tidefell-$version-x86_64-unknown-linux-gnu"
          gh release download "v$version" --repo tidefell/tidefell --pattern "$name.tar.gz" --pattern "$name.tar.gz.sha256"
          sha256sum --check "$name.tar.gz.sha256"
          tar -xzf "$name.tar.gz"
          echo "$PWD/$name" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      # Keyed by runner type: the cache stores paths relative to the workspace, which sits at a
      # different depth on GitHub's images and on the self-hosted runner.
      - name: Cache iroh-relay
        id: relay
        uses: actions/cache@v4
        with:
          path: ~/.local/iroh-relay
          key: iroh-relay-${{ runner.environment }}-${{ env.IROH_RELAY_VERSION }}
      - name: Build iroh-relay
        if: steps.relay.outputs.cache-hit != 'true'
        run: >
          cargo install iroh-relay --version "$IROH_RELAY_VERSION" --locked --features server
          --root "$HOME/.local/iroh-relay"
      - name: Put iroh-relay on PATH
        run: |
          echo "$HOME/.local/iroh-relay/bin" >> "$GITHUB_PATH"
          "$HOME/.local/iroh-relay/bin/iroh-relay" --version
      - name: Enable KVM
        # GitHub's images need a udev rule to open /dev/kvm; the self-hosted runner's user is
        # already in the kvm group.
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is usable"
            exit 0
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: scripts/ci-exit-criterion.sh
