# detekt's defaults, with these changes (ADR 0031). Existing findings are in detekt-baseline.xml.
style:
  MagicNumber:
    # A number given a name where it is declared is not magic, such as each colour of the theme.
    ignorePropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 140
  ForbiddenImport:
    active: true
    # The app logs through AppLog, so its messages reach the log files and diagnostics bundles.
    imports:
      - value: "android.util.Log"
        reason: "Use AppLog, which logs through the engine."
    excludes: ["**/AppLog.kt", "**/test/**", "**/androidTest/**"]
complexity:
  LongParameterList:
    # A composable takes its optional look as parameters with defaults, as Compose's own do.
    ignoreAnnotated: ["Composable"]
naming:
  FunctionNaming:
    # Compose names composable functions like types.
    ignoreAnnotated: ["Composable"]
formatting:
  MaximumLineLength:
    maxLineLength: 140
  ArgumentListWrapping:
    maxLineLength: 140
